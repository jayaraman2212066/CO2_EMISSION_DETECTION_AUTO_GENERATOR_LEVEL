services:
  - type: web
    name: co2-emission-detection
    env: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 300 --workers 1 --threads 1 --max-requests 100
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "3"
      - key: DATABASE_URL
        value: sqlite:///co2_predictions.db
    healthCheckPath: /
    autoDeploy: true 